- name: Common
  hosts: all
  become: true
  roles:
    - common

- name: Servers
  hosts: all:!control_server
  become: true

  pre_tasks:
    - name: Check if Tailscale is installed
      ansible.builtin.shell: |
        tailscale version
      register: tailscale_check
      ignore_errors: true
      changed_when: false

    - name: Set fact for Tailscale presence
      ansible.builtin.set_fact:
        tailscale_installed: "{{ tailscale_check.rc == 0 }}"

  roles:
    - docker
    - role: artis3n.tailscale.machine
      tags: [needs-secrets]
      vars:
        tailscale_authkey: "{{ lookup('community.general.bitwarden', 'tailscale_auth_key', field='notes')[0] }}"
      when: not tailscale_installed
    - role: compose_up
      tags: [needs-secrets]

- name: Network
  hosts: dnsmasq_servers
  become: true
  roles:
    - dnsmasq
