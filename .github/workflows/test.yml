name: Lint & Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"
          cache: pip
      
      - name: Setup just
        uses: taiki-e/install-action@ea85faa6acd705ad6d40586db99f1a70b09c2929 # just

      - name: Create virtual environment and install dependencies
        run: |
          just venv
          echo "PATH=$(pwd)/.venv/bin:${PATH}" >> "${GITHUB_ENV}"
          echo "VIRTUAL_ENV=$(pwd)/.venv" >> "${GITHUB_ENV}"

      - name: Run Ansible-Lint
        run: just lint --offline --sarif-file ansible-lint.sarif.json

      - name: Upload Ansible-Lint SARIF
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4
        with:
          sarif_file: ansible-lint.sarif.json
          category: ansible-lint
