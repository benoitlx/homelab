---
# Forge a fresh, single-use Headscale pre-auth key via the Headscale API.
# Shared between roles/compose_up (per-service sidecars) and
# playbooks/tasks/mint_tailscale_authkey.yml (host-level joins) see docs/secrets.md.
#
# Required caller input: headscale_preauthkey_api_key.
# Produces: headscale_preauthkey_key (fact, not loged).
#
# Always delegated to localhost (the machine running the playbook), hitting
# the public headscale_server_url. The user id lookup is cached in a fact
# for the remainder of the run, so it only happens once per host even
# across multiple callers/loop iterations.

- name: Look up the Headscale user id for {{ headscale_preauthkey_user }}
  ansible.builtin.uri:
    url: "{{ headscale_server_url }}/api/v1/user?name={{ headscale_preauthkey_user }}"
    headers:
      Authorization: "Bearer {{ headscale_preauthkey_api_key }}"
  register: headscale_preauthkey_user_lookup
  delegate_to: localhost
  become: false
  no_log: true
  when: headscale_preauthkey_user_id is not defined

- name: Cache the Headscale user id for this run
  ansible.builtin.set_fact:
    headscale_preauthkey_user_id: "{{ headscale_preauthkey_user_lookup.json.users[0].id }}"
  when: headscale_preauthkey_user_lookup is not skipped

- name: Create the pre-auth key
  ansible.builtin.uri:
    url: "{{ headscale_server_url }}/api/v1/preauthkey"
    method: POST
    headers:
      Authorization: "Bearer {{ headscale_preauthkey_api_key }}"
    body_format: json
    body:
      user: "{{ headscale_preauthkey_user_id }}"
      reusable: false
      ephemeral: false
      expiration: >-
        {{ '%Y-%m-%dT%H:%M:%SZ' | strftime((ansible_date_time.epoch | int) + headscale_preauthkey_expiration_seconds) }}
      aclTags: "{{ headscale_preauthkey_tags | unique | map('regex_replace', '^', 'tag:') | list }}"
  register: headscale_preauthkey_created
  delegate_to: localhost
  become: false
  no_log: true

- name: Expose the freshly minted key
  ansible.builtin.set_fact:
    headscale_preauthkey_key: "{{ headscale_preauthkey_created.json.preAuthKey.key }}"
  no_log: true
